name: Update and Publish Chocolatey Package

permissions:
  contents: write
  pull-requests: write

# Serialize workflow_dispatch runs so back-to-back triggers can't interleave
# commits or collide on the `package-sources` artifact name. We do NOT cancel
# an in-progress run -- letting one finish (including environment approval) is
# safer than cancelling mid-publish.
concurrency:
  group: update-and-publish
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional: override version (else auto-detect from URL filename, then EXE)"
        required: false
      url:
        # Must be the direct, version-pinned installer URL, e.g.
        #   https://update-software.sonos.com/software/<id>/Sonos_90.0-77070.exe
        #
        # Do NOT use https://www.sonos.com/redir/controller_software_pc2 here.
        # That shortlink is behind Akamai bot management and returns HTTP 403 to
        # every non-browser client (curl, Invoke-WebRequest, Chocolatey's own
        # downloader), so both this workflow and `choco install` fail on it.
        # To get the direct URL: open the Sonos downloads page in a browser,
        # start the Windows download, then copy the resolved URL from the
        # browser's download list (or read the HostUrl from the downloaded
        # file's Zone.Identifier alternate data stream).
        description: "Direct installer URL (update-software.sonos.com/software/<id>/Sonos_<ver>.exe)"
        required: true
      commit_push:
        description: "Commit and push updated files"
        required: true
        type: boolean
        default: true
      publish:
        description: "Pack and push to Chocolatey"
        required: true
        type: boolean
        default: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.export.outputs.version }}
      sha256: ${{ steps.export.outputs.sha256 }}
      # `commit_sha` is the SHA the update job committed and successfully
      # pushed to main. Empty when no push was attempted or the push failed --
      # in that case the publish job falls back to the dispatch-time ref and
      # relies on the artifact handoff for the two tracked files it cares about.
      commit_sha: ${{ steps.export.outputs.commit_sha }}
      # `push_outcome` is the result of the `Push to main` step ('success',
      # 'failure', 'cancelled', or 'skipped'). The publish job consults it to
      # avoid publishing a version whose source commit never reached main.
      push_outcome: ${{ steps.push_changes.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set variables
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') { echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV }
          echo "PKG_URL=${{ github.event.inputs.url }}" >> $env:GITHUB_ENV

      - name: Download installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference    = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path downloads | Out-Null

          if ($env:PKG_URL -match '^https?://(www\.)?sonos\.com/redir/') {
            throw @"
          Refusing to download from the www.sonos.com/redir/ shortlink.
          It is bot-protected (Akamai) and answers scripted clients with HTTP 403,
          so both this workflow and 'choco install' would fail on it.
          Re-run with the direct, version-pinned URL instead, e.g.
            https://update-software.sonos.com/software/<id>/Sonos_90.0-77070.exe
          "@
          }

          try {
            Invoke-WebRequest -Uri "$env:PKG_URL" -OutFile downloads/sonos-controller.exe -MaximumRedirection 10 -UseBasicParsing
          } catch {
            throw "Download failed for $env:PKG_URL -- $($_.Exception.Message)"
          }

          # Validate we actually got an installer and not an HTML error page. A
          # bot-protection or CDN error page can arrive with HTTP 200, in which
          # case the run would otherwise happily hash the HTML and publish a
          # package whose checksum matches a few hundred bytes of markup.
          $file = Get-Item downloads/sonos-controller.exe
          if ($file.Length -lt 10MB) {
            throw "Downloaded file is only $($file.Length) bytes -- expected a ~55 MB installer. The URL likely returned an error page."
          }
          $fs = [System.IO.File]::OpenRead($file.FullName)
          try {
            $head = New-Object byte[] 2
            $null = $fs.Read($head, 0, 2)
          } finally {
            $fs.Dispose()
          }
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
            throw "Downloaded file is not a Windows executable (missing 'MZ' header)."
          }
          Write-Host "Downloaded $($file.Length) bytes from $env:PKG_URL"

      - name: Compute SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash downloads/sonos-controller.exe -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Determine version (if not provided)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VERSION -or -not $env:VERSION.Trim()) {
            function Normalize-Version($s) {
              if (-not $s) { return $null }
              $m = [regex]::Match($s, '(\d+\.\d+\.\d+(?:\.\d+)?)')
              if ($m.Success) { return $m.Value } else { return $null }
            }

            # 1. The installer filename is the most reliable source and the one
            #    that matches the published package series: Sonos_90.0-77070.exe
            #    -> 90.0.77070. EXE metadata has historically disagreed with it
            #    (FileVersion reporting a 16.x app version while the download and
            #    the Chocolatey package both track the 90.x series), and shipping
            #    a 16.x version would be rejected as going backwards from 90.x.
            $name = [System.IO.Path]::GetFileName(([uri]$env:PKG_URL).AbsolutePath)
            $m = [regex]::Match($name, 'Sonos[_-](\d+\.\d+)-(\d+)')
            $fromName = if ($m.Success) { "$($m.Groups[1].Value).$($m.Groups[2].Value)" } else { $null }

            # 2. Fall back to EXE metadata, ProductVersion first -- both fields
            #    currently report the 90.x series.
            $vi   = (Get-Item 'downloads/sonos-controller.exe').VersionInfo
            $prod = Normalize-Version $vi.ProductVersion
            $file = Normalize-Version $vi.FileVersion

            $ver = if ($fromName) { $fromName } elseif ($prod) { $prod } elseif ($file) { $file } else { $null }
            if (-not $ver) { throw 'Could not determine a version from the URL filename or the EXE metadata' }
            Write-Host "Version sources -- filename: $fromName, ProductVersion: $prod, FileVersion: $file -> using $ver"
            echo "VERSION=$ver" >> $env:GITHUB_ENV
          }

      - name: Guard against non-increasing version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $current = [regex]::Match((Get-Content chocolatey/sonos-controller.nuspec -Raw), '<version>(.*?)</version>').Groups[1].Value
          # Chocolatey rejects a push whose version is already published, and a
          # lower version would silently downgrade the package feed. Catch both
          # here rather than after the installer has been fetched and committed.
          if ([version]$env:VERSION -lt [version]$current) {
            throw "Refusing to go backwards: detected $env:VERSION is lower than the packaged $current."
          }
          if ([version]$env:VERSION -eq [version]$current) {
            Write-Host "::warning::Version $env:VERSION already matches the packaged version -- nothing to commit, and 'choco push' will reject it as a duplicate."
          }

      - name: Update nuspec and install script
        shell: pwsh
        run: |
          $nuspec = "chocolatey/sonos-controller.nuspec"
          $ps1    = "chocolatey/ChocolateyInstall.ps1"

          # Update nuspec fields
          (Get-Content $nuspec) `
            -replace '<version>.*?</version>', "<version>$env:VERSION</version>" `
            | Set-Content $nuspec -Encoding UTF8

          # Update install script variables.
          #
          # IMPORTANT: the regex *patterns* are single-quoted PowerShell
          # strings on purpose. In double-quoted strings, "\$version" is
          # parsed as a literal backslash followed by an interpolated
          # $version variable (PS escape char is backtick, not backslash).
          # Since $version is unset in the runner shell, the resulting regex
          # becomes "\\s*=\s*'.*?'" and matches nothing -- the install script
          # is silently never updated, the nuspec marches forward alone, and
          # the published .nupkg ships with a stale $version + $checksum.
          # See the incident on 2026-04-14 (90.0.68190 published broken).
          #
          # Single-quoting the patterns disables interpolation entirely, so
          # \$ stays as a literal backslash + dollar, which the .NET regex
          # engine then reads as an escaped literal $. Single quotes inside
          # a single-quoted string are escaped by doubling them ('').
          # The replacement strings stay double-quoted so $env:VERSION etc.
          # still interpolate; the literal $version in the output is
          # protected by the backtick escape (`$version).
          (Get-Content $ps1) `
            -replace '\$version\s*=\s*''.*?''',  "`$version = '$env:VERSION'" `
            -replace '\$url\s*=\s*''.*?''',      "`$url = '$env:PKG_URL'" `
            -replace '\$checksum\s*=\s*''.*?''', "`$checksum = '$env:SHA256'" `
            | Set-Content $ps1 -Encoding UTF8

      - name: Show changes
        shell: bash
        run: |
          git --no-pager diff -- chocolatey/sonos-controller.nuspec chocolatey/ChocolateyInstall.ps1 || true

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chocolatey/sonos-controller.nuspec chocolatey/ChocolateyInstall.ps1
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0;
          fi
          git commit -m "chore: update to $VERSION (hash $SHA256)"

      - name: Push to main
        id: push_changes
        if: ${{ fromJSON(github.event.inputs.commit_push) }}
        continue-on-error: true
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git push origin HEAD:main

      - name: Create Pull Request (fallback or when push disabled)
        if: ${{ !fromJSON(github.event.inputs.commit_push) || steps.push_changes.outcome != 'success' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update to ${{ env.VERSION }} (hash ${{ env.SHA256 }})"
          branch: "auto/choco-update-${{ env.VERSION }}"
          title: "chore: update to ${{ env.VERSION }}"
          body: |
            Automated update:
            - Version: ${{ env.VERSION }}
            - URL: ${{ env.PKG_URL }}
            - SHA256: ${{ env.SHA256 }}
            
            This PR was created because the workflow could not push directly to main or direct push was disabled.

      - name: Export version/sha/commit for publish job
        id: export
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"   >> "$GITHUB_OUTPUT"
          # Only expose commit_sha if the push actually succeeded -- otherwise
          # the SHA points at a commit that no remote has, and publishing from
          # it would violate the audit trail (and `actions/checkout` in the
          # publish job would fail to resolve the ref).
          if [ "${{ steps.push_changes.outcome }}" = "success" ]; then
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload updated package sources
        if: ${{ fromJSON(github.event.inputs.publish) }}
        uses: actions/upload-artifact@v4
        with:
          name: package-sources
          path: |
            chocolatey/sonos-controller.nuspec
            chocolatey/ChocolateyInstall.ps1
          if-no-files-found: error
          # 7 days gives the environment approver a realistic recovery window
          # if `choco push` hits a transient failure and the job needs to be
          # re-run without forcing `update` to re-fetch the installer (the
          # sonos.com redirect URL is mutable, so a same-day re-fetch could
          # return different bytes).
          retention-days: 7

  publish:
    # This job consumes CHOCO_API_KEY and is gated by the `chocolatey-publish`
    # environment -- a maintainer must approve the deployment from the Actions
    # UI before the job starts. The environment is created in repo Settings ->
    # Environments with `@fsch` as a required reviewer, and CHOCO_API_KEY is
    # stored as an environment-scoped secret (not a repo-level secret).
    # See SECURITY.md.
    needs: update
    # Publish runs only when:
    #   1. the dispatcher requested it (`publish: true`), AND
    #   2. EITHER the dispatcher opted out of pushing (`commit_push: false`,
    #      in which case publishing from the artifact is the explicit intent)
    #      OR the push to main actually succeeded.
    # This prevents the silent footgun where a failed push falls back to a PR
    # and the package is still published from a commit that never reached main.
    if: |
      fromJSON(github.event.inputs.publish) &&
      (!fromJSON(github.event.inputs.commit_push) || needs.update.outputs.push_outcome == 'success')
    runs-on: windows-latest
    timeout-minutes: 15
    environment: chocolatey-publish
    # This job handles CHOCO_API_KEY. It does not need write access to the
    # repository or PRs, so we narrow permissions from the workflow default
    # (contents: write, pull-requests: write) down to read-only.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit the update job pushed to main. Empty when
          # `commit_push: false` -- in that case we fall back to the dispatch-
          # time ref and rely on the artifact handoff to overlay the two
          # tracked files that matter for packing.
          ref: ${{ needs.update.outputs.commit_sha }}
          persist-credentials: false

      - name: Download updated package sources
        uses: actions/download-artifact@v4
        with:
          name: package-sources
          path: chocolatey

      - name: Pack and Push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ needs.update.outputs.version }}
          SHA256:  ${{ needs.update.outputs.sha256 }}
        run: |
          Write-Host "Publishing version $env:VERSION (sha256 $env:SHA256)"
          choco pack chocolatey/sonos-controller.nuspec --outputdirectory out
          if (-not $env:CHOCO_API_KEY) { throw "Missing CHOCO_API_KEY secret" }
          choco apikey -k $env:CHOCO_API_KEY -s https://push.chocolatey.org/
          choco push (Get-ChildItem out/*.nupkg | Select-Object -First 1).FullName --source https://push.chocolatey.org/
