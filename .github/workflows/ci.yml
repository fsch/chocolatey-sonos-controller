name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify nuspec and install script consistency
        shell: bash
        run: |
          set -euo pipefail
          NUSPEC=chocolatey/sonos-controller.nuspec
          PS1=chocolatey/ChocolateyInstall.ps1

          nv=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$NUSPEC")

          pv=$(sed -n "s/\$version\s*=\s*'\(.*\)'/\1/p" "$PS1")
          pu=$(sed -n "s/\$url\s*=\s*'\(.*\)'/\1/p" "$PS1")
          ph=$(sed -n "s/\$checksum\s*=\s*'\(.*\)'/\1/p" "$PS1")

          echo "nuspec version=$nv"
          echo "ps1    version=$pv url=$pu checksum=$ph"

          test -n "$nv" && test -n "$pv" && [ "$nv" = "$pv" ] || { echo "Version mismatch"; exit 1; }

          # Assert nuspec does not contain invalid 'url' or 'checksum' elements
          if grep -qE '<(url|checksum)>' "$NUSPEC"; then echo "Invalid elements (url/checksum) found in nuspec"; exit 1; fi
          # Assert PS1 has required fields
          test -n "$pu" || { echo "PS1 missing $url"; exit 1; }
          test -n "$ph" || { echo "PS1 missing $checksum"; exit 1; }

          # The www.sonos.com/redir/* shortlink is behind Akamai bot management
          # and returns HTTP 403 to Chocolatey's downloader, so a package
          # pointing at it cannot install. Only the direct, version-pinned
          # update-software.sonos.com URL works unattended.
          case "$pu" in
            https://www.sonos.com/redir/*|https://sonos.com/redir/*)
              echo "PS1 \$url points at the bot-protected sonos.com/redir shortlink (403s for non-browser clients). Use the direct update-software.sonos.com URL."; exit 1;;
            https://*) ;;
            *) echo "PS1 \$url must be an https URL"; exit 1;;
          esac

          # A SHA256 must be 64 lowercase hex chars; anything else means the
          # checksum was never substituted or got mangled.
          echo "$ph" | grep -Eq '^[0-9a-f]{64}$' || { echo "PS1 \$checksum is not a lowercase sha256 hex digest"; exit 1; }

      - name: Ensure no binaries committed
        shell: bash
        run: |
          # NOTE: the pattern is '\.', not '\\.'. Inside bash single quotes the
          # latter is a literal backslash followed by "any char", so the check
          # only ever matched paths containing a backslash -- i.e. it passed
          # unconditionally and never blocked a committed binary.
          ! git ls-files | grep -Ei '\.(exe|msi|zip|7z|nupkg)$' || { echo "Binary artifacts should not be committed"; exit 1; }
